name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Giữ sát bản stable mới nhất. SDK cũ hỏng build Windows: Flutter chỉ ánh xạ
  # được các phiên bản Visual Studio nó biết, gặp bản mới hơn thì rơi về generator
  # mặc định "Visual Studio 16 2019" và CMake không tìm thấy trình biên dịch nào.
  FLUTTER_VERSION: "3.44.8"

jobs:
  analyze:
    name: Phân tích tĩnh & định dạng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos

  test:
    name: Kiểm thử
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  integration:
    name: Kiểm thử tích hợp (luồng đầy đủ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cài thư viện hệ thống cho Linux desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      # Chạy trên Linux desktop dưới Xvfb: đây là nền tảng duy nhất dựng được
      # trên runner rẻ, và luồng cần kiểm là logic chứ không phải thứ riêng của
      # iOS/Android.
      - name: Chạy integration test
        run: xvfb-run -a flutter test integration_test -d linux

  build:
    name: Build ${{ matrix.target }}
    needs: [analyze, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            cmd: flutter build apk --debug
          - target: linux
            os: ubuntu-latest
            cmd: flutter build linux --debug
          - target: ios
            os: macos-latest
            cmd: flutter build ios --debug --no-codesign
          - target: macos
            os: macos-latest
            cmd: flutter build macos --debug
          - target: windows
            os: windows-latest
            cmd: flutter build windows --debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cài thư viện hệ thống cho Linux desktop
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: ${{ matrix.cmd }}
