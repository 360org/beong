name: Release

# Chạy tay từ tab Actions — chọn track/lane rồi bấm Run workflow.
# Trước khi chạy: tăng `version:` trong pubspec.yaml (build number phải tăng
# mỗi lần nộp lên store).
on:
  workflow_dispatch:
    inputs:
      android_track:
        description: "Play Console track"
        type: choice
        options: [internal, production]
        default: internal
      ios_lane:
        description: "Fastlane iOS lane"
        type: choice
        options: [beta, release]
        default: beta
      platforms:
        description: "Nền tảng cần phát hành"
        type: choice
        options: [both, android, ios]
        default: both

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  android-release:
    name: Phát hành Android
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      - name: Giải mã keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore.jks

      - name: Build App Bundle
        env:
          ANDROID_KEYSTORE_PATH: release.keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Giải mã service account Play Console
        run: echo '${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}' > /tmp/play-service-account.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Cài fastlane
        run: gem install fastlane -N

      - name: Đẩy lên Play Console
        working-directory: android
        env:
          PLAY_STORE_JSON_KEY_PATH: /tmp/play-service-account.json
        run: fastlane ${{ inputs.android_track }}

      - name: Xoá file bí mật
        if: always()
        run: |
          rm -f android/app/release.keystore.jks /tmp/play-service-account.json

  ios-release:
    name: Phát hành iOS
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      - name: Import chứng chỉ ký & provisioning profile
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ci-runner-temp-keychain
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/dist_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$IOS_DIST_CERTIFICATE_BASE64" | base64 -d -o "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Tạo ExportOptions.plist
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          sed \
            -e "s/__TEAM_ID__/${IOS_TEAM_ID}/" \
            -e "s/__PROFILE_NAME__/${IOS_PROVISIONING_PROFILE_NAME}/" \
            ios/ExportOptions.plist.template > ios/ExportOptions.plist

      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Giải mã App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Cài fastlane
        run: gem install fastlane -N

      - name: Đẩy lên App Store Connect
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          IPA_PATH="$(find "$GITHUB_WORKSPACE/build/ios/ipa" -name '*.ipa' -print -quit)"
          IPA_PATH="$IPA_PATH" fastlane ${{ inputs.ios_lane }}

      - name: Xoá file bí mật
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ci-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist_certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/AuthKey.p8"
          rm -f ios/ExportOptions.plist
