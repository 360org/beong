name: Release

# Hai đường chạy:
#
# - **Push tag `v*`** -> PHÁT HÀNH CÔNG KHAI. Nộp duyệt App Store kèm tự phát
#   hành, và đẩy Play track `production`. Đây là quy ước của dự án: tag nghĩa là
#   ra bản chính thức, không phải bản thử.
# - **Chạy tay từ tab Actions** -> chọn lane/track, dùng cho bản thử
#   (`beta` / `internal`) hoặc khi chỉ muốn chạy một nền tảng.
#
# Điều kiện tiên quyết của lane công khai (kiểm thật ở run #15/#16 ngày
# 22/08/2026): **hồ sơ app trên store phải điền xong**. Thiếu ảnh chụp, mô tả,
# phân loại độ tuổi, giá, chính sách quyền riêng tư... thì binary vẫn lên được
# App Store Connect nhưng `submit_for_review` hỏng, và chạy lại chỉ tốn thêm
# build number. Danh sách đầy đủ ở `docs/08-release-cicd.md` §B-5/B-6.
#
# Hai điều phải làm trước khi tag:
#
# 1. Tăng phần *marketing version* của `version:` trong pubspec.yaml (và
#    `kPhienBanApp` kèm theo). Phần `+build` thì không cần đụng tới: CI tự cấp
#    build number từ số thứ tự run, nên không bao giờ trùng bản đã nộp nữa.
# 2. Kiểm `CHANGELOGS.md` xem còn lỗi nghiêm trọng nào chưa sửa không. Tag là
#    đường một chiều: bản đã phát hành công khai thì gỡ xuống được, nhưng người
#    đã cài rồi thì không thu lại được.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      android_track:
        description: "Play Console track"
        type: choice
        options: [internal, production]
        default: production
      ios_lane:
        description: "Fastlane iOS lane"
        type: choice
        options: [release, beta]
        default: release
      platforms:
        description: "Nền tảng cần phát hành"
        type: choice
        options: [both, android, ios]
        default: both

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  android-release:
    name: Phát hành Android
    if: ${{ github.event_name == 'push' || inputs.platforms == 'both' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Kiểm **trước khi build**, và không ghi ra đĩa. Để bước này nằm sau
      # `flutter build appbundle` thì secret sai chỉ lộ ra sau bốn phút build
      # — bốn phút để biết một điều đã biết được ngay từ giây thứ mười.
      - name: Kiểm secret Play Console
        env:
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_JSON:-}" ]; then
            echo "::error::Secret PLAY_STORE_SERVICE_ACCOUNT_JSON rỗng hoặc chưa đặt."
            exit 1
          fi
          hop_le=$(printf '%s' "$PLAY_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('type',''))" 2>/dev/null || true)
          if [ "$hop_le" != "service_account" ]; then
            echo "::error::PLAY_STORE_SERVICE_ACCOUNT_JSON không phải khoá service account. Dán nguyên văn file JSON tải từ Google Cloud (có dòng \"type\": \"service_account\"), không mã hoá base64."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      - name: Giải mã keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Chưa nạp secret ANDROID_KEYSTORE_BASE64 (xem docs/08-release-cicd.md §A-3)"
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore.jks

          if [ ! -s android/app/release.keystore.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 giải mã ra file rỗng — dán lại, dùng 'base64 -w0' để không lẫn newline"
            exit 1
          fi

      - name: Build App Bundle
        env:
          ANDROID_KEYSTORE_PATH: release.keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Build number do CI cấp, **không** lấy `+build` trong pubspec.
          # Lý do ở đây, không phải lý thuyết: run #27 (24/08/2026) build IPA
          # thành công rồi hỏng ở bước đẩy, vì `+14` đã nằm trên TestFlight —
          # `ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE`. Con người quên tăng
          # build number; công thức dưới đây thì không. Nhân 10 rồi cộng
          # `run_attempt` để chạy lại một run cũng ra số mới.
          BUILD_NUMBER=$(( 1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          echo "Build number: $BUILD_NUMBER"
          flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Lưu trữ file AAB (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: beong-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # `printf %s` với giá trị đi qua env, không phải `echo '...'` nội suy
      # thẳng: JSON có dấu nháy đơn là câu lệnh vỡ, và giá trị lọt vào chỗ shell
      # phân tích cú pháp là thứ không nên có.
      #
      # Kiểm luôn tại chỗ. Không kiểm thì secret rỗng hay dán nhầm bản base64
      # chỉ lộ ra sau khi build xong AAB — bốn phút sau — bằng đúng một dòng
      # "Invalid Google Credentials file provided", không nói secret nào.
      - name: Giải mã service account Play Console
        env:
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAY_JSON" > /tmp/play-service-account.json
          if [ ! -s /tmp/play-service-account.json ]; then
            echo "::error::Secret PLAY_STORE_SERVICE_ACCOUNT_JSON rỗng hoặc chưa đặt."
            exit 1
          fi


      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Cài fastlane
        run: gem install fastlane -N

      - name: Đẩy lên Play Console
        working-directory: android
        env:
          PLAY_STORE_JSON_KEY_PATH: /tmp/play-service-account.json
        run: fastlane ${{ inputs.android_track || 'production' }}

      - name: Xoá file bí mật
        if: always()
        run: |
          rm -f android/app/release.keystore.jks /tmp/play-service-account.json

  ios-release:
    name: Phát hành iOS
    if: ${{ github.event_name == 'push' || inputs.platforms == 'both' || inputs.platforms == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      - name: Import chứng chỉ ký & provisioning profile
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ci-runner-temp-keychain
        run: |
          set -euo pipefail

          # Secret rỗng thì `security import` báo "SecKeychainItemImport: Unable to
          # decode the provided data" — nghe như file .p12 hỏng, nên người đọc đi
          # export lại chứng chỉ, trong khi thật ra chưa nạp secret. Đã mất một lần
          # chạy vì đúng câu này; chặn ở đây với lý do đúng.
          missing=""
          for name in IOS_DIST_CERTIFICATE_BASE64 IOS_DIST_CERTIFICATE_PASSWORD \
                      IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Chưa nạp secret iOS:$missing (xem docs/08-release-cicd.md §B-2, §B-3)"
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/dist_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$IOS_DIST_CERTIFICATE_BASE64" | base64 -d -o "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Tạo ExportOptions.plist
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${IOS_TEAM_ID}" ] || [ -z "${IOS_PROVISIONING_PROFILE_NAME}" ]; then
            echo "::error::Thiếu IOS_TEAM_ID hoặc IOS_PROVISIONING_PROFILE_NAME (xem docs/08-release-cicd.md §B-3)"
            exit 1
          fi

          # Không dùng `sed` ở đây: trong chuỗi thay thế của sed, `&` có nghĩa là
          # "toàn bộ phần khớp", nên tên profile kiểu "Bé Ong & Family" sẽ bị
          # thay thành "__PROFILE_NAME__ Family" — plist vẫn hợp lệ, build vẫn
          # chạy, rồi chết ở bước ký với "No profile matching ... found" mà không
          # nói tên nó đang tìm. Dấu `/` trong tên cũng phá luôn dấu phân cách.
          # plistlib thay theo khoá, không diễn giải ký tự nào.
          python3 - "$IOS_TEAM_ID" "$IOS_PROVISIONING_PROFILE_NAME" <<'PY'
          import plistlib
          import sys

          team_id, profile_name = sys.argv[1], sys.argv[2]
          with open('ios/ExportOptions.plist.template', 'rb') as f:
              plist = plistlib.load(f)

          plist['teamID'] = team_id
          # Khoá là bundle ID, phải khớp `net.beong.app` trong template.
          (bundle_id,) = plist['provisioningProfiles']
          plist['provisioningProfiles'][bundle_id] = profile_name

          with open('ios/ExportOptions.plist', 'wb') as f:
              plistlib.dump(plist, f)

          print(f'ExportOptions.plist: {bundle_id} -> {profile_name!r}, team {team_id}')
          PY

      - name: Build IPA
        run: |
          # Cùng công thức với Android — xem chú thích ở bước Build App Bundle.
          BUILD_NUMBER=$(( 1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Giải mã App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Cài fastlane
        run: gem install fastlane -N

      - name: Đẩy lên App Store Connect
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          IPA_PATH="$(find "$GITHUB_WORKSPACE/build/ios/ipa" -name '*.ipa' -print -quit)"
          IPA_PATH="$IPA_PATH" fastlane ${{ inputs.ios_lane || 'release' }}

      - name: Xoá file bí mật
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ci-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist_certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/AuthKey.p8"
          rm -f ios/ExportOptions.plist
