# Đăng trang giới thiệu (thư mục `site/`) lên GitHub Pages.
#
# Vì sao publish từ `site/` chứ không phải `docs/`: GitHub Pages có chế độ phục vụ
# thẳng thư mục `docs/`, nhưng `docs/` của repo này là tài liệu nội bộ — ADR, lộ
# trình, 67 ảnh chụp. Trỏ Pages vào đó là vô tình xuất bản cả kho tài liệu kỹ thuật
# ra công khai dưới dạng file thô.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Đang deploy dở mà có push mới thì để bản đang chạy xong đã, không huỷ giữa chừng.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Kiểm mọi liên kết và ảnh nội bộ đều trỏ tới file có thật
        # Ảnh vỡ hoặc link 404 là lỗi nhìn thấy ngay nhưng CI không bao giờ tự báo.
        # Rẻ hơn nhiều so với việc phát hiện sau khi đã đăng.
        run: |
          set -euo pipefail
          thieu=0
          for page in site/*.html; do
            for f in $(grep -ohE '(src|href)="[^"]*"' "$page" | cut -d'"' -f2); do
              case "$f" in http*|data:*|\#*) continue ;; esac
              base="${f%%#*}"
              [ -z "$base" ] && continue
              if [ ! -f "site/$base" ]; then
                echo "::error file=$page::liên kết hỏng -> $base"; thieu=1
              fi
            done
          done
          exit $thieu

      - name: Trang giới thiệu không được lộ chi tiết kỹ thuật
        # Yêu cầu của chủ dự án: website nói với phụ huynh, không nói với lập trình
        # viên. Không có bước này thì một lần sửa vội là chữ "Flutter" quay lại.
        run: |
          set -euo pipefail
          loi=0
          for page in site/*.html; do
            # bỏ <head>, <style>, <script> rồi bỏ thẻ -> chỉ còn chữ người đọc thấy
            text=$(python3 - "$page" <<'EOF'
          import re,sys,html
          s=open(sys.argv[1]).read()
          s=re.sub(r'<(script|style|head)[^>]*>.*?</\1>','',s,flags=re.S|re.I)
          print(html.unescape(re.sub(r'<[^>]+>',' ',s)))
          EOF
          )
            hit=$(printf '%s' "$text" | grep -oiE 'flutter|github|drift|sqlite|riverpod|ADR-[0-9]+|bundle id|mã nguồn|SDK|endpoint' | sort -u || true)
            if [ -n "$hit" ]; then
              echo "::error file=$page::lộ chi tiết kỹ thuật -> $(echo $hit)"; loi=1
            fi
          done
          exit $loi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
