name: beong
description: "Ứng dụng việc nhà và phần thưởng hằng ngày cho gia đình và trẻ em."
publish_to: "none"

# <phiên bản hiển thị>+<build number>
version: 0.5.0+25

environment:
  sdk: ^3.12.0

# Sắp xếp theo bảng chữ cái (lint sort_pub_dependencies).
# Vai trò của từng gói: xem docs/02-architecture.md §2.
dependencies:
  collection: ^1.19.1
  # Băm mật khẩu hồ sơ. Là dep gián tiếp sẵn có, nhưng khai tường minh vì code
  # của app import trực tiếp — dựa vào dep gián tiếp là để nó biến mất bất cứ
  # lúc nào một gói khác đổi phụ thuộc.
  crypto: ^3.0.7
  drift: ^2.34.3 # DB local, offline-first — ADR-002
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2 # state management — ADR-003
  go_router: ^17.3.0
  http: ^1.6.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  meta: ^1.16.0
  mobile_scanner: ^6.0.4
  path: ^1.9.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.3
  sqlite3: ^3.5.0 # kèm sẵn thư viện native; sqlite3_flutter_libs đã EOL
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.4
  very_good_analysis: ^10.0.0
  yaml: ^3.1.2 # test đọc lại khai báo font trong pubspec

flutter:
  uses-material-design: true
  generate: true

  # Bộ icon Fluent Emoji kiểu 3D (MIT) — xem assets/icons/README.md. Khai cả thư
  # mục thay vì từng file: thêm icon chỉ cần bỏ file vào, không sửa pubspec, mà
  # sửa pubspec là chỗ rất dễ quên rồi nhận ô trống lúc chạy.
  assets:
    - assets/icons/

  # Nunito — bo tròn thân thiện trẻ em, đủ 134 ký tự tiếng Việt có dấu
  # (docs/04-design-system.md §2). Nhúng file thay vì dùng gói `google_fonts`
  # tải lúc chạy: app là offline-first (ADR-002), mất mạng không được mất chữ.
  #
  # Dùng bản static cho từng weight chứ không dùng file variable: mặc định của
  # trục wght là 200 (ExtraLight), nền tảng nào không áp được biến thiên sẽ
  # hiện toàn bộ chữ mảnh dính. Sinh lại bằng fontTools.varLib.instancer khi
  # cần thêm weight.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
