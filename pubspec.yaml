name: beong
description: "Ứng dụng việc nhà và phần thưởng hằng ngày cho gia đình và trẻ em."
publish_to: "none"

# <phiên bản hiển thị>+<build number>
version: 0.1.0+1

environment:
  sdk: ^3.12.0

# Sắp xếp theo bảng chữ cái (lint sort_pub_dependencies).
# Vai trò của từng gói: xem docs/02-architecture.md §2.
dependencies:
  collection: ^1.19.1
  drift: ^2.34.3 # DB local, offline-first — ADR-002
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2 # state management — ADR-003
  freezed_annotation: ^3.0.0
  go_router: ^17.3.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.3
  sqlite3: ^3.5.0 # kèm sẵn thư viện native; sqlite3_flutter_libs đã EOL
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.4
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
