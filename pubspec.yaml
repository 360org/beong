name: dailychildren
description: "Ứng dụng việc nhà và phần thưởng hằng ngày cho gia đình và trẻ em."
publish_to: "none"

# <phiên bản hiển thị>+<build number>
version: 0.1.0+1

environment:
  sdk: ^3.8.0

# Sắp xếp theo bảng chữ cái (lint sort_pub_dependencies).
# Vai trò của từng gói: xem docs/02-architecture.md §2.
dependencies:
  collection: ^1.19.1
  drift: ^2.26.0 # DB local, offline-first — ADR-002
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1 # state management — ADR-003
  freezed_annotation: ^3.0.0
  go_router: ^14.8.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod_annotation: ^2.6.1
  sqlite3_flutter_libs: ^0.5.32
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  riverpod_generator: ^2.6.5
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true
